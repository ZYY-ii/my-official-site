name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: [ main ]  # 确保这里是你推送代码的分支名（通常是 main 或 master）
  workflow_dispatch:

jobs:
  build-and-deploy:
    #  关键修改：授予写入内容的权限
    permissions:
      contents: write
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node.js ️
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies 📦
        run: npm install

      - name: Build 🏗️
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          # 确保使用 GITHUB_TOKEN
          token: ${{ secrets.GITHUB_TOKEN }} 
